# pnpm 11 policy — copied into every scaffolded site (storageService walkTemplate)
# and injected into pre-yaml sites by dependencyInstallService. Keep the two in sync.
# strictDepBuilds:false = unapproved dep build scripts skip+warn (pnpm 10 behavior)
# instead of ERR_PNPM_IGNORED_BUILDS exit 1 (pnpm 11 default).
# pmOnFail:ignore = never self-download the packageManager pin at runtime — the
# container's pnpm (Dockerfile, npm-installed) is the only runtime.
# nodeLinker:hoisted = flat node_modules (not the isolated/symlinked default) so
# Next's standalone build traces `next` into .next/standalone/node_modules — else
# `node server.js` at preview crashes with "Cannot find module 'next'". pnpm 11
# reads the linker from HERE (camelCase), not .npmrc's node-linker.
nodeLinker: hoisted
strictDepBuilds: false
allowBuilds:
  "@prisma/engines": true
  prisma: true
  sharp: true
  # deliberately skipped (work via prebuilt platform binaries); explicit false
  # stops pnpm from appending "set this to true or false" placeholders per site
  esbuild: false
  workerd: false
pmOnFail: ignore
minimumReleaseAge: 1440
# pnpm 11 minimumReleaseAge rejects lockfile entries published <24h ago.
# pnpm writes these excludes itself on `pnpm install` after a dep bump — when
# regenerating pnpm-lock.yaml, commit this file's mutations too. Entries are
# version-scoped and become inert once the release ages out.
